name: Verify flagship build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install build tools
        run: npm ci --prefix website
      - name: Build static artifact
        run: npm run build --prefix website
      - name: Run contract gates
        run: |
          npm test --prefix website
          python3 qa/qw_audit.py website
          for file in website/js/*.js; do node --check "$file"; done
          test "$(wc -c < website/js/main.js)" -le 8000
          test "$(wc -c < website/js/fluid.js)" -le 8000
      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: doebel-leipzig-v2026.09j
          path: website/dist/
